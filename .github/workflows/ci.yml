name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore BSL.sln

      - name: Build solution
        run: dotnet build BSL.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test BSL.Test/BSL.Test.csproj -c Release --no-build --verbosity normal