name: CI

on:
  push:
    branches: [ "main", "master", "chore/ci-and-readme" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bsl_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore BSL.slnx

      - name: Build solution
        run: dotnet build BSL.slnx -c Release --no-restore

      - name: Run tests
        env:
          TestConnectionString: Host=localhost;Port=5432;Database=bsl_db;Username=postgres;Password=postgres_password
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=bsl_db;Username=postgres;Password=postgres_password
        run: |
          dotnet user-secrets set "TestConnectionString" "Host=localhost;Port=5432;Database=bsl_db;Username=postgres;Password=postgres_password" --project BSL.Test/BSL.Test.csproj
          dotnet test BSL.slnx -c Release --no-build --verbosity normal
