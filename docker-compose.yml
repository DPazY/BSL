services:
  postgres:
    image: postgres:16-alpine
    container_name: bsl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bsl_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bsl_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bsl-app:
    container_name: bsl-app
    build:
      context: .
      dockerfile: BSL.App/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionString=Host=postgres;Port=5432;Database=bsl_db;Username=postgres;Password=postgres_password
      - WorkDir=/app/data
      - FileWatcher=/app/watch
      - ProcessedFile=None
    volumes:
      - bsl_watch:/app/watch
      - bsl_data:/app/data

  bsl-ui:
    container_name: bsl-ui
    build:
      context: ./bsl-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - bsl-app
    ports:
      - "3080:80"

volumes:
  postgres_data:
  bsl_watch:
  bsl_data: